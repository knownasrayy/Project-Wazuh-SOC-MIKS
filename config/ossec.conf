<!--
  File   : ossec.conf
  Lokasi : /var/ossec/etc/ossec.conf (di VM1)
  Orang  : Orang 2 — Wazuh Manager

  CATATAN: Ini adalah snippet bagian yang perlu diubah saja.
  Jangan replace seluruh ossec.conf dengan file ini.

  Cara edit di VM1:
    sudo nano /var/ossec/etc/ossec.conf
  Setelah selesai, restart:
    sudo systemctl restart wazuh-manager
-->

<!-- Bagian <global>: aktifkan logging lengkap -->
<global>
  <email_notification>no</email_notification>
  <logall>yes</logall>
  <logall_json>yes</logall_json>
</global>

<!-- Bagian <alerts>: simpan semua alert dari level 3 ke atas -->
<alerts>
  <log_alert_level>3</log_alert_level>
  <use_json>yes</use_json>
</alerts>

<!-- Bagian <remote>: konfigurasi port untuk koneksi dari agent -->
<remote>
  <connection>secure</connection>
  <port>1514</port>
  <protocol>tcp</protocol>
</remote>
