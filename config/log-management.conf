<!--
  File   : log-management.conf
  Lokasi : /var/ossec/etc/ossec.conf (di VM2 Agent)
  Orang  : Orang 4 — Log Management

  Deskripsi:
  Snippet konfigurasi ini mengatur <client_buffer> untuk agent, 
  mencegah event drops (kehilangan log) pada saat agent menerima
  ribuan baris syslog dari iptables per detik akibat serangan DDoS.

  Cara Penggunaan:
  Sisipkan di antara tag <ossec_config> pada file ossec.conf agent VM2.
-->

  <client_buffer>
    <!-- Aktifkan antrean buffer -->
    <disabled>no</disabled>
    
    <!-- Tingkatkan kapasitas memory buffer agent dari default (5000) menjadi 15000 
         agar bisa menampung traffic log yang masif secara sementara -->
    <queue_size>15000</queue_size>
    
    <!-- Tingkatkan limit kecepatan upload log ke Manager (dari default 500) 
         menjadi 1000 agar backlog di agent lebih cepat tersalurkan -->
    <events_per_second>1000</events_per_second>
  </client_buffer>
