<!--
  File   : ossec_ai_integration.conf
  Role   : A6 — AI Engineer (Integration ke Wazuh)
  Lokasi : Tambahkan isi file ini ke /var/ossec/etc/ossec.conf di VM1

  CATATAN: Ini adalah SNIPPET — tambahkan ke ossec.conf yang sudah ada,
  JANGAN replace seluruh file. Sisipkan di dalam tag <ossec_config>.

  Cara edit di VM1:
    sudo nano /var/ossec/etc/ossec.conf
  Setelah selesai, restart:
    sudo systemctl restart wazuh-manager
-->

<!-- ═══════════════════════════════════════════════════════════ -->
<!-- BAGIAN 1: Command Definition                               -->
<!-- Mendefinisikan script ai_verdict.py sebagai command         -->
<!-- yang bisa dipanggil oleh Active Response.                   -->
<!-- ═══════════════════════════════════════════════════════════ -->

<command>
  <name>ai-verdict</name>
  <executable>ai_verdict.py</executable>
  <timeout_allowed>no</timeout_allowed>
</command>

<!-- ═══════════════════════════════════════════════════════════ -->
<!-- BAGIAN 2: Active Response Trigger                          -->
<!-- Mengikat command ai-verdict ke alert level >= 3             -->
<!-- (sesuai log_alert_level yang sudah dikonfigurasi Orang 2).  -->
<!--                                                             -->
<!-- Setiap alert yang masuk akan dikirim ke ai_verdict.py       -->
<!-- via stdin, yang kemudian forward ke Flask AI server.         -->
<!-- ═══════════════════════════════════════════════════════════ -->

<active-response>
  <command>ai-verdict</command>
  <location>server</location>
  <level>3</level>
</active-response>

<!-- ═══════════════════════════════════════════════════════════ -->
<!-- BAGIAN 3: Monitor AI Verdict Log                           -->
<!-- Wazuh akan membaca log output dari AI verdict               -->
<!-- agar hasilnya bisa diparsing oleh custom rules              -->
<!-- dan muncul di Dashboard sebagai alert baru.                 -->
<!-- ═══════════════════════════════════════════════════════════ -->

<localfile>
  <log_format>syslog</log_format>
  <location>/var/ossec/logs/ai_verdicts.log</location>
</localfile>
